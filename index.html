<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Shadowvale — Tamers of the Shadow Wyrm</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0b0914;display:flex;align-items:center;justify-content:center;font-family:Trebuchet MS,sans-serif}
  #wrap{position:relative;width:min(100vw,150vh);aspect-ratio:3/2}
  canvas{width:100%;height:100%;display:block;outline:none;touch-action:manipulation;image-rendering:pixelated;border-radius:8px;box-shadow:0 0 40px #5a3d9a55}
  #login{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
  #login .card{margin-top:14%;width:min(380px,80%);background:rgba(18,16,30,.94);border:2px solid #c8a458;border-radius:12px;padding:18px 22px;color:#eee;box-shadow:0 10px 40px #000a}
  #login h2{margin:0 0 6px;color:#ffd84a;text-align:center;font-size:20px}
  #lg-status{font-size:13px;text-align:center;margin-bottom:10px;color:#ccc}
  #lg-status.warn{color:#ffcc66}
  #login input{width:100%;box-sizing:border-box;margin:4px 0;padding:9px 10px;border-radius:7px;border:1px solid #5a4a8a;background:#221e34;color:#fff;font-size:14px}
  #login button{width:100%;margin-top:7px;padding:9px;border-radius:7px;border:1px solid #c8a458;background:#3a3060;color:#fff;font-weight:bold;font-size:14px;cursor:pointer}
  #login button:hover:not(:disabled){background:#5a4a8a}
  #login button:disabled{opacity:.5;cursor:wait}
  #lg-google{background:#fff !important;color:#222 !important;border-color:#ddd !important}
  #lg-offline{background:#2a2a2a !important;border-color:#777 !important}
  #lg-toggle{background:none !important;border:none !important;color:#9ae6ff !important;font-weight:normal !important;font-size:12px !important}
  #lg-msg{min-height:18px;font-size:13px;margin-top:6px;text-align:center}
  #lg-msg.err{color:#ff7a7a} #lg-msg.ok{color:#7be07b}
  .or{text-align:center;color:#888;font-size:12px;margin:8px 0 0}
  #chat-input{position:absolute;left:1%;bottom:13%;width:44%;display:none;padding:7px 10px;border-radius:6px;border:1px solid #9ae6ff;background:rgba(0,0,0,.8);color:#fff;font-size:14px}
</style></head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640" tabindex="0"></canvas>
  <div id="login"><div class="card">
    <h2>Welcome, Tamer</h2>
    <div id="lg-status">Connecting to multiplayer services…</div>
    <div id="lg-form" style="display:none">
      <div id="lg-signup-extra" style="display:none"><input id="lg-name" placeholder="Tamer name (shown to other players)" maxlength="20"></div>
      <input id="lg-email" type="email" placeholder="Email" autocomplete="email">
      <input id="lg-pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
      <button id="lg-submit">Sign in</button>
      <button id="lg-toggle">New here? Create an account</button>
      <div class="or">— or —</div>
      <button id="lg-google">Continue with Google</button>
    </div>
    <button id="lg-offline">Play offline</button>
    <div id="lg-msg"></div>
  </div></div>
  <input id="chat-input" maxlength="200" placeholder="Say something… (Enter to send, Esc to cancel)">
</div>
<!-- Sections: firebase-config → data (config) → world → core → render → battle → mp (multiplayer glue) → main → ui → input; net.js (Firebase module) -->
<script src="js/firebase-config.js"></script>
<script src="js/data.js"></script><script src="js/world.js"></script><script src="js/core.js"></script><script src="js/render.js"></script>
<script src="js/battle.js"></script><script src="js/mp.js"></script><script src="js/main.js"></script><script src="js/ui.js"></script><script src="js/legend.js"></script><script src="js/input.js"></script>
<script type="module" src="js/net.js"></script>
</body></html>
